---
services:
  stirling-pdf:
    container_name: stirling-pdf
    image: ghcr.io/stirling-tools/stirling-pdf:3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080/tcp"
    environment:
      SECURITY_ENABLELOGIN: "false"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./configs:/configs
